name: Update Telegram Messages

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: update-telegram-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      MARKETAPP_API_TOKEN: ${{ secrets.MARKETAPP_API_TOKEN }}

      NUMBERS_CHAT_ID: ${{ secrets.NUMBERS_CHAT_ID }}
      NUMBERS_MESSAGE_ID: ${{ secrets.NUMBERS_MESSAGE_ID }}

      PROMO_CHAT_ID: ${{ secrets.PROMO_CHAT_ID }}
      PROMO_MESSAGE_ID: ${{ secrets.PROMO_MESSAGE_ID }}

      NUMBERS_URL: "https://marketapp.ws/collection/EQAOQdwdw8kGftJCSFgOErM1mBjYPe4DBPq8-AhF6vr9si5N/"

      TZ: "Asia/Shanghai"
      TON_USD_OVERRIDE: ""
      MARKET_BROWSER: "chromium"
      RUN_MODE: "online"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: |
          python -m playwright install chromium

      - name: Run bot
        run: python bot.py
